# Blueprint de Render: un servicio web Node.js + una base de datos PostgreSQL.
databases:
  - name: ods9-db
    plan: free
    databaseName: ods9
    user: ods9

services:
  - type: web
    name: ods9-infraestructura
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/apoyos
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ods9-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
